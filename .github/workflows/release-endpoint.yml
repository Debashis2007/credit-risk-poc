name: Release endpoint (reusable)

# One Terraform release of the credit-risk endpoint into one environment. Called by
# model-deploy.yml for staging and for Prod; the job runs in the GitHub environment
# ml-<environment>, so ml-prod's required reviewers are the manual approval before Prod.
on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod
        type: string
        required: true
      endpoint_name:
        type: string
        required: true
      model_package_arn:
        type: string
        required: true
      instance_count:
        type: number
        required: true
      check:
        description: Verify the served revision and score the catalog presets after the release
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ml-${{ inputs.environment }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      PACKAGE_ARN: ${{ inputs.model_package_arn }}
      ENDPOINT: ${{ inputs.endpoint_name }}
      MODEL_PACKAGE_GROUP: ${{ vars.MLP_MODEL_PACKAGE_GROUP || 'ModelCreditRisk' }}
      PIPELINE_NAME: ${{ vars.MLP_PIPELINE_NAME || 'credit-risk' }}
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_endpoint_name: ${{ inputs.endpoint_name }}
      TF_VAR_model_package_arn: ${{ inputs.model_package_arn }}
      TF_VAR_instance_count: ${{ inputs.instance_count }}
      TF_VAR_data_capture_s3_uri: ${{ vars.MLP_DATA_CAPTURE_S3_URI }}
    defaults:
      run:
        working-directory: infra/endpoint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify the package is approved in this model's registry group
        run: |
          DESC=$(aws sagemaker describe-model-package --model-package-name "$PACKAGE_ARN")
          GROUP=$(jq -r .ModelPackageGroupName <<<"$DESC")
          STATUS=$(jq -r .ModelApprovalStatus <<<"$DESC")
          [ "$GROUP" = "$MODEL_PACKAGE_GROUP" ] || { echo "::error::package is in $GROUP, not $MODEL_PACKAGE_GROUP"; exit 1; }
          [ "$STATUS" = "Approved" ] || { echo "::error::package is $STATUS, not Approved"; exit 1; }
          ROLE="${{ vars.MLP_INFERENCE_ROLE_ARN }}"
          [ -n "$ROLE" ] || ROLE=$(aws sagemaker describe-pipeline --pipeline-name "$PIPELINE_NAME" --query RoleArn --output text)
          {
            echo "TF_VAR_release_id=v$(jq -r .ModelPackageVersion <<<"$DESC")"
            echo "TF_VAR_instance_type=$(jq -r '.InferenceSpecification.SupportedRealtimeInferenceInstanceTypes[0] // "ml.t2.medium"' <<<"$DESC")"
            echo "TF_VAR_execution_role_arn=$ROLE"
          } >> "$GITHUB_ENV"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - name: Terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.MLP_TF_STATE_BUCKET }}" \
            -backend-config="key=credit-risk/endpoint-${{ inputs.environment }}.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"
      - name: Adopt an endpoint created before Terraform managed it
        run: |
          if ! terraform state list | grep -qx aws_sagemaker_endpoint.this \
             && aws sagemaker describe-endpoint --endpoint-name "$ENDPOINT" >/dev/null 2>&1; then
            terraform import -input=false aws_sagemaker_endpoint.this "$ENDPOINT"
          fi
      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply (blue/green; staging all at once, Prod 10% canary for 15 minutes)
        run: terraform apply -input=false tfplan
      - name: Wait for the endpoint
        run: aws sagemaker wait endpoint-in-service --endpoint-name "$ENDPOINT"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        if: inputs.check
        with:
          python-version: "3.11"
      - name: Verify served revision and predictions
        if: inputs.check
        working-directory: .
        run: |
          pip install "boto3>=1.34,<1.36"
          python scripts/endpoint_check.py --endpoint "$ENDPOINT" --package-arn "$PACKAGE_ARN" \
            --region "$AWS_REGION" --higher "Risky applicant" --lower "Safe applicant"

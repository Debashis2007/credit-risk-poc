name: Model deploy — staging, test, approval, Prod

# Starts when a senior data scientist approves a package in the SageMaker Model Registry:
# EventBridge invokes the deploy-trigger Lambda (infra/deploy-trigger), which sends a
# repository_dispatch of type model-approved. Run it by hand with workflow_dispatch to
# redeploy an approved package.
#
#   deploy-staging  Terraform release to the staging endpoint, all at once
#   test-staging    served revision and test predictions on staging
#   deploy-prod     waits for the ml-prod environment's required reviewers (MLOps), then a
#                   Terraform release to the Prod endpoint as a 10% canary for 15 minutes
on:
  repository_dispatch:
    types: [model-approved]
  workflow_dispatch:
    inputs:
      model_package_arn:
        description: Approved model package ARN in ModelCreditRisk
        type: string
        required: true

permissions:
  id-token: write
  contents: read

concurrency:
  group: model-deploy-credit-risk
  cancel-in-progress: false

jobs:
  deploy-staging:
    uses: ./.github/workflows/release-endpoint.yml
    with:
      environment: staging
      endpoint_name: ${{ vars.MLP_STAGING_ENDPOINT || 'credit-risk-qa' }}
      model_package_arn: ${{ github.event.client_payload.model_package_arn || inputs.model_package_arn }}
      instance_count: 1
      check: false
    secrets: inherit

  test-staging:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: ml-staging
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ secrets.MLP_GHA_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Served revision and test predictions on staging
        run: |
          pip install "boto3>=1.34,<1.36"
          python scripts/endpoint_check.py \
            --endpoint "${{ vars.MLP_STAGING_ENDPOINT || 'credit-risk-qa' }}" \
            --package-arn "${{ github.event.client_payload.model_package_arn || inputs.model_package_arn }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --higher "Risky applicant" --lower "Safe applicant"

  deploy-prod:
    needs: test-staging
    uses: ./.github/workflows/release-endpoint.yml
    with:
      environment: prod
      endpoint_name: ${{ vars.MLP_PROD_ENDPOINT || 'credit-risk-prod' }}
      model_package_arn: ${{ github.event.client_payload.model_package_arn || inputs.model_package_arn }}
      instance_count: 2
      check: true
    secrets: inherit
